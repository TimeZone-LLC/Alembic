name: alembic
description: "Desktop GitHub workspace and archive manager."
publish_to: 'none'
version: 1.5.1
environment:
  sdk: '>=3.4.4 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  arcane: ^6.5.13
  window_manager: ^0.5.1
  tray_manager: ^0.5.2
  screen_retriever: ^0.2.0
  github: ^9.25.0
  path_provider: ^2.1.5
  path: ^1.9.1
  url_launcher: ^6.3.2
  fast_log: ^1.0.7
  flutter_svg: ^2.2.3
  launch_at_startup: ^0.5.1
  package_info_plus: ^9.0.0
  http: ^1.6.0
  crypto: ^3.0.6
  file_picker: ^10.3.10
  hive_flutter: ^1.1.0
  rxdart: ^0.28.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: false
  assets:
    - assets/app_icon.ico
    - assets/icon.svg
    - assets/launcher.png
    - assets/login.svg
    - assets/tray.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-Variable.ttf
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
        - asset: assets/fonts/JetBrainsMono-Italic-Variable.ttf
          style: italic
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/launcher.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: true
    image_path: "assets/launcher.png"
scripts:
  pod_install_mac: cd macos && rm Podfile.lock && pod install --repo-update
  codesign: cd build/macos/Build/Products/Release && codesign --deep --force --verify --sign "Alembic" alembic.app
  launcher_icons: flutter pub get && dart run flutter_launcher_icons
  distrib: bash scripts/release/build_macos.sh
  distrib_windows: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/build_windows.ps1
